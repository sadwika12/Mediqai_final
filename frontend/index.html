<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0D2B3E" />
<meta name="description" content="MediQAI — AI-powered health screening platform for symptom analysis, disease risk assessment, and clinical decision support." />
<script>
/* Apply the saved (or system) theme before first paint so there is no light/dark flash. */
(function(){try{var s=localStorage.getItem('mediqai_theme');var t=s?JSON.parse(s):null;if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<title>MediQAI — Clinical Health Screening Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
